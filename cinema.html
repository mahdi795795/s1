<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🎬 فیلم‌های در حال نمایش</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', 'Tahoma', sans-serif;
      background: #f0f8ff;
      direction: rtl;
      padding: 40px 20px;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      color: #0077cc;
      margin-bottom: 30px;
    }

    .movie-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
      margin: auto;
    }

    .movie-link {
      background-color: #e0f7fa;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      color: #00796b;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(0,188,212,0.3);
      transition: 0.3s;
      display: block;
    }

    .movie-link:hover {
      background-color: #b2ebf2;
      transform: scale(1.03);
    }

    .admin-link {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #6c5ce7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
      transition: 0.3s;
    }

    .admin-link:hover {
      background-color: #5a4bcf;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 1.6rem;
      }

      .movie-link {
        font-size: 1rem;
        padding: 12px;
      }

      .admin-link {
        font-size: 0.9rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <h2>🎬 فیلم‌های در حال نمایش</h2>
  <div class="movie-list">
    {% for movie in movies %}
      <a class="movie-link" href="{{ url_for('movie_detail', movie_id=movie.id) }}">
        {{ movie.title }}
      </a>
    {% endfor %}
  </div>

  <a class="admin-link" href="{{ url_for('login') }}">🔐 ورود مدیریت</a>
</body>
</html>
