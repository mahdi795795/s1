<h2>افزودن فیلم جدید</h2>
<form method="POST">
  <input name="title" placeholder="عنوان فیلم" required>
  <textarea name="description" placeholder="توضیحات"></textarea>
  <input name="price" type="number" placeholder="قیمت بلیط" required>
  <input name="date" type="text" placeholder="تاریخ" required>
  <input name="time" type="text" placeholder="ساعت" required>
  <button type="submit">افزودن</button>
</form>
